services:
  - type: web
    name: call-player
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: FATHOM_API_KEY
        sync: false
      - key: FATHOM_SESSION
        sync: false
      - key: APP_SECRET
        sync: false
